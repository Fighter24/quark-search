# Render.com 部署配置
services:
  - type: web
    name: quark-search
    runtime: python
    plan: free  # Render 免费计划（每月750小时，够用24/7）
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: ACCESS_PASSWORD
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
